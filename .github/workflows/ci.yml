name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'cleanup/**']
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Nothing here writes to the repo; the deploy job only makes an
# outbound HTTPS call. Declared explicitly so a future action cannot inherit a
# broader default token.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Directory.Build.props turns warnings into errors when this is set, and makes
  # the build deterministic so output is comparable across machines.
  ContinuousIntegrationBuild: true
  # Ratchets. Each is floor(measured) - 1, so an honest refactor does not trip it but a real
  # regression does. Measured when they were last raised (WP-50, Release, managed only):
  # overall 90.38% line / 79.39% branch, Portfolio.Web 84.78% / 67.95%. Raise them when coverage
  # rises; never lower them to make a build green, and never below 80% line / 60% branch.
  # tools/metrics/coverage_gate.py reads the first two from the environment by name.
  MIN_LINE_COVERAGE: '89'
  MIN_BRANCH_COVERAGE: '78'
  # Per-assembly floors for Portfolio.Web, which the overall figure would otherwise hide behind
  # the much larger (and much better covered) Portfolio.Services.
  MIN_WEB_LINE_COVERAGE: '83'
  MIN_WEB_BRANCH_COVERAGE: '66'

jobs:
  # ---------------------------------------------------------------------------
  # The gate. Runs the suite the way a clean clone does: no native libraries
  # present, every kernel on its managed fallback.
  # ---------------------------------------------------------------------------
  test:
    name: Build, test & coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Central package management means one file pins every version, so it is
      # an exact cache key for the whole restore graph.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Fails the build on a known-vulnerable package (NU1902/3/4 are promoted to
      # errors in Directory.Build.props).
      - name: Restore
        run: dotnet restore

      # Whitespace, final newline, charset and using order per .editorconfig. Migrations and the generated
      # road network are never reformatted. To fix a failure locally, run the same command without
      # --verify-no-changes and --no-restore.
      - name: Verify formatting
        run: >
          dotnet format Portfolio.sln --verify-no-changes --no-restore
          --exclude Portfolio.Repositories/Migrations Portfolio.Services/Data/RedlandsRoadNetwork.cs

      # Warnings are errors here. Locally they stay warnings so a half-finished
      # edit does not block the inner loop.
      - name: Build (warnings are errors)
        run: dotnet build --no-restore -c Release

      - name: Test with coverage
        run: >
          dotnet test Portfolio.Tests --no-build -c Release
          --collect:"XPlat Code Coverage"
          --settings coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory TestResults

      # tools/metrics/coverage_gate.py: the same script a developer runs locally. It parses the cobertura
      # report with the standard library rather than a marketplace action, so the gate has no supply
      # chain of its own. It picks the single report under TestResults and refuses if the trx logger left
      # a differing copy, then checks the overall floors (MIN_LINE_COVERAGE / MIN_BRANCH_COVERAGE from
      # the env block above) and the Portfolio.Web floors.
      - name: Enforce coverage thresholds
        run: >
          python3 -I tools/metrics/coverage_gate.py TestResults
          --summary coverage-summary.md
          --package-floor Portfolio.Web "$MIN_WEB_LINE_COVERAGE" "$MIN_WEB_BRANCH_COVERAGE"

      - name: Publish coverage to the job summary
        if: always()
        run: cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results & coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: |
            TestResults/**/*.trx
            TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Builds all thirteen C++ kernels and runs the suite again with them present.
  #
  # This is the job that matters most. NativeParityTests skip when the shared
  # libraries are absent, so the gate above never exercises a single line of
  # C++. Two real defects shipped precisely because nothing compared the two
  # implementations: a bounding-box clip that clamped vertices instead of
  # clipping the polygon, and a viewshed ray walk whose rounding disagreed with
  # the managed path. Both would have failed here.
  # ---------------------------------------------------------------------------
  native-parity:
    name: Native kernels & parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Debug, because each kernel's CMakeLists copies its output into
      # bin/Debug/net10.0 by default.
      - name: Build solution
        run: dotnet build -c Debug

      - name: Build native kernels
        run: |
          set -euo pipefail
          for dir in native/*/; do
            kernel=$(basename "$dir")
            [ -f "$dir/CMakeLists.txt" ] || continue
            echo "::group::$kernel"
            cmake -S "$dir" -B "build/native/$kernel" -DCMAKE_BUILD_TYPE=Release
            cmake --build "build/native/$kernel" --config Release
            echo "::endgroup::"
          done

      - name: Stage kernels into the test output
        run: |
          set -euo pipefail
          out=Portfolio.Tests/bin/Debug/net10.0
          mkdir -p "$out"
          find build/native -name '*.so' -exec cp -v {} "$out/" \;
          staged=$(find "$out" -name '*.so' | wc -l)
          echo "Kernels staged: $staged"
          # Every kernel with a CMakeLists must produce a library. A silent drop
          # to zero would make the parity run below pass without testing anything.
          expected=$(find native -mindepth 2 -maxdepth 2 -name CMakeLists.txt | wc -l)
          if [ "$staged" -ne "$expected" ]; then
            echo "::error::Expected $expected kernels, staged $staged."
            exit 1
          fi

      # NativeAvailabilityTests fails this step if any of the 13 bridges did not load,
      # so a broken staging step cannot leave the native-gated tests all skipped and
      # the job green. No coverage gate here by design (it measures lower than the
      # managed run).
      - name: Test with native kernels present
        env:
          PORTFOLIO_REQUIRE_NATIVE: '1'
        run: dotnet test Portfolio.Tests --no-build -c Debug --logger "console;verbosity=normal"

      # The fallback is production behaviour — the deployed container compiles no
      # native code — so it gets asserted explicitly rather than assumed.
      - name: Test again with the native path disabled
        env:
          PORTFOLIO_DISABLE_NATIVE: '1'
        run: dotnet test Portfolio.Tests --no-build -c Debug --logger "console;verbosity=normal"

  # ---------------------------------------------------------------------------
  # The production image. Adding Portfolio.Benchmarks to the solution once broke
  # this build and nothing caught it until a deploy failed.
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Flags a pull request that introduces a vulnerable dependency. Not a deploy
  # prerequisite: it only runs on pull requests.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low

  # ---------------------------------------------------------------------------
  # Optional deploy gate. Inert until BOTH of these are true:
  #   1. RENDER_DEPLOY_HOOK is set as a repository secret
  #      (Render -> service -> Settings -> Deploy Hook)
  #   2. Auto-Deploy is switched OFF in Render
  #
  # Until then Render keeps deploying every push to main directly, which means
  # a red build still ships. With both in place, only a green build deploys.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Render
    needs: [test, native-parity, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK}" ]; then
            echo "RENDER_DEPLOY_HOOK is not set — skipping."
            echo "Render's own auto-deploy is presumably still handling this."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "${RENDER_DEPLOY_HOOK}"
          echo "Deploy triggered."
