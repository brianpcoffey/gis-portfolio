# Dependabot opens pull requests; it never merges them. NuGet central package
# management (Directory.Packages.props) is handled by the nuget ecosystem.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      aspnetcore-efcore:
        patterns: ["Microsoft.*", "Npgsql.*", "Asp.Versioning.*"]
        exclude-patterns: ["Microsoft.NET.Test.Sdk"]
      test:
        patterns: ["xunit*", "Moq", "coverlet.*", "Microsoft.NET.Test.Sdk"]
    ignore:
      # Microsoft.OpenApi is pinned on 2.x deliberately; 3.x breaks compilation.
      - dependency-name: "Microsoft.OpenApi"
        update-types: ["version-update:semver-major"]
      # xunit.v3 4.x needs the Microsoft.Testing.Platform `dotnet test` mode and a new
      # coverage setup; that migration is planned separately.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
