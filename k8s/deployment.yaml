apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
  labels:
    app: portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portfolio
          # Replace REPLACE_ME with the pushed image tag; do not use a mutable tag such as latest.
          image: portfolio:REPLACE_ME
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: portfolio-config
            - secretRef:
                name: portfolio-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: dataprotection
              mountPath: /app/DataProtection-Keys
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: dataprotection
          # With Redis-backed Data Protection (PersistKeysToStackExchangeRedis), the filesystem
          # mount is not the source of truth for key storage. emptyDir is intentional — keys live
          # in Redis, not the pod filesystem. Each pod loads keys from Redis at startup.
          emptyDir: {}
        - name: tmp
          emptyDir: {}
